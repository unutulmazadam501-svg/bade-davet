name: Publish Ba&De demo

on:
  push:
    branches: [main]
    paths:
      - bade-site.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published package
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract static website
        run: python -m zipfile -e bade-site.zip site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
